service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >
    Giữ ngưỡng 3000ms (khớp threshold panel latency trong config/dashboard.yaml).
    Baseline sau khi prompt day13-chat có trên Langfuse: P50 = 152ms, P95 = 1333ms,
    P99 = 1539ms (23 request, data/logs.jsonl). Ngưỡng 3000ms cao hơn P99 bình thường
    khoảng 2 lần nên không báo động giả, nhưng vẫn bắt được incident rag_slow (+2.5s
    retrieval) cộng độ trễ bình thường. Target 99.5% vì app là chatbot hỗ trợ, không
    phải hệ thống giao dịch; chấp nhận 1/200 request lỗi hoặc chậm.
  error_budget:
    formula: 'budget_requests = total_requests * (100 - target_percent) / 100'
    example: >
      Với 10,000 request trong 28 ngày, error budget 0.5% = 50 request được phép lỗi
      hoặc chậm hơn 3000ms. Nếu workload lab chạy ~1,000 request/ngày thì 28 ngày có
      28,000 request và budget là 140 request.
    burn_rate: >
      Burn rate = tỉ lệ bad trong cửa sổ quan sát / 0.5%. Burn rate 14.4 trong 1 giờ
      nghĩa là tiêu 2% budget 28 ngày trong 1 giờ -> page ngay.
    observed_in_lab: >
      data/logs.jsonl hiện có 51 request, 40 request tốt (78.43%). 11 request vi phạm
      đều xảy ra trước khi tạo prompt trên Langfuse: 10 request ~6.2s do fetch prompt
      không tồn tại và 1 request 735,713ms khi mạng tới cloud.langfuse.com bị treo.
      Nguyên nhân chung: fetch prompt nằm trên đường xử lý request.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
